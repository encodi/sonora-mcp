version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint declares a peer range below TypeScript 6.1; bumping
      # past it breaks `npm ci`. Remove once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Type definitions must match the supported runtime (Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"

name: Bug report
description: Something does not work as documented
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste tokens, authorization codes, `tokens.json` or your Client ID.**
        Logs from sonora-mcp are redacted, but please double-check before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs. actual behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. sonora-mcp login --mode playback\n2. Ask the client to ..."
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [read-only, playback]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "sonora-mcp --version, `node -v`, OS, MCP client (e.g. Claude Desktop 1.x)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error message (redacted)
      render: shell

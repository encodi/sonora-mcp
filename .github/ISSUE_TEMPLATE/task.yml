name: Task (technical / chore)
description: "Internal work (refactor, CI, docs, tooling)"
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] \n- [ ] "
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / dependencies
